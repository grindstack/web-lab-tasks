<svg width="500" height="120" xmlns="http://www.w3.org/2000/svg">

  <!-- Background glow -->
  <rect width="500" height="120" fill="#050510"></rect>

  <!-- Neon line -->
  <rect y="55" width="500" height="4" fill="#8a5bff" opacity="0.4"></rect>

  <!-- Glowing pulse orb -->
  <circle cx="40" cy="57" r="10" fill="#c45bff">
    <animate attributeName="cx" from="40" to="460" dur="2.5s" repeatCount="indefinite" begin="0s"></animate>
    <animate attributeName="r" values="8;14;8" dur="1s" repeatCount="indefinite"></animate>
  </circle>

  <!-- Motion trail effect -->
  <circle cx="40" cy="57" r="20" fill="#c45bff" opacity="0.15">
    <animate attributeName="cx" from="40" to="460" dur="2.5s" repeatCount="indefinite"></animate>
  </circle>

</svg>
